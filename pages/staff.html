<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trevor Day School Yearbook</title>
  <!-- Style sheet -->
  <link rel="stylesheet" href="../resources/style.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Display the navbar -->
  <div id="navbar"></div>

  <!-- Page title header -->
  <div class="main-content">
    <h1>Trevor Day School Yearbook Staff</h1>
  </div>

  <!-- Staff cards are added to each section from the Google Sheet by staff.js -->
  <section class="yearbook-staff">
    <section class="editors" id="editors">
      <h1>Editors</h1>
    </section>
    <section class="team" id="team">
      <h1>Staff</h1>
    </section>
    <section class="faculty-advisors" id="faculty-advisors">
      <h1>Faculty Advisors</h1>
    </section>
  </section>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="../resources/staff.js"></script>
  <script type="module" src="../resources/navbar.js"></script>
</body>

</html>
